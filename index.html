<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BG Tracker</title>
<meta name="theme-color" content="#14161c" />
<meta name="description" content="Type 1 diabetes pattern tracker" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BG Tracker" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #14161c; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const EXERCISE_TYPES = ["Run", "Walk", "Lift", "Bike", "Other"];
const STORAGE_KEY = "bg-tracker-entries";
const EST = "America/New_York";

function formatEST(iso) {
  return new Date(iso).toLocaleString("en-US", {
    timeZone: EST, month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
  });
}

function nowESTForInput() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: EST, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(new Date());
  const get = (t) => parts.find((p) => p.type === t).value;
  return `${get("year")}-${get("month")}-${get("day")}T${get("hour")}:${get("minute")}`;
}

function estInputToISO(localStr) {
  const [datePart, timePart] = localStr.split("T");
  const [y, m, d] = datePart.split("-").map(Number);
  const [hh, mm] = timePart.split(":").map(Number);
  const guessUTC = new Date(Date.UTC(y, m - 1, d, hh, mm));
  const estStr = new Intl.DateTimeFormat("en-US", {
    timeZone: EST, hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit",
  }).format(guessUTC);
  const [dPart, tPart] = estStr.split(", ");
  const [em, ed, ey] = dPart.split("/").map(Number);
  const [eh, emin] = tPart.split(":").map(Number);
  const estAsUTC = Date.UTC(ey, em - 1, ed, eh, emin);
  const offsetMs = estAsUTC - guessUTC.getTime();
  return new Date(guessUTC.getTime() - offsetMs).toISOString();
}

function bucketLabel(hrs) {
  const start = Math.floor(hrs * 2) / 2;
  return `${start}-${start + 0.5}h`;
}

function emptyEntry() {
  return {
    id: null, timestamp: nowESTForInput(), bg: "", iob: "", basal: "",
    foodCarb: false, foodProtein: false, foodFat: false,
    carbG: "", proteinG: "", fatG: "", showFoodDetail: false,
    stress: "", exerciseType: "", exerciseDuration: "", training: false,
    isf: "", notes: "",
  };
}

function foodTagLabel(e) {
  const tags = [];
  if (e.foodCarb) tags.push("Carb");
  if (e.foodProtein) tags.push("Protein");
  if (e.foodFat) tags.push("Fat");
  return tags.length ? tags.join("+") : null;
}

const IOB_DURATION_MIN = 240; // 4hr linear decay, user-confirmed
const FOOD_WINDOWS = {
  // hours active, based on general digestion physiology (not personalized)
  "Carb": 2.5,
  "Protein": 3,
  "Fat": 4,
  "Carb+Protein": 3,
  "Carb+Fat": 4,
  "Protein+Fat": 4,
  "Carb+Protein+Fat": 4,
};
const EXERCISE_FALLBACK_HOURS = 4; // used until user has enough logged data per type
const STRESS_WINDOW_HOURS = 2;

function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveEntries(entries) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); return true; }
  catch (e) { return false; }
}

// Looks at an exercise type's own logged history (via the same bucket logic as
// the Insights tab) and returns the last bucket boundary where BG was still
// visibly moving vs. baseline. Falls back to EXERCISE_FALLBACK_HOURS if there
// isn't enough data yet.
function observedExerciseWindow(sorted, type) {
  const anchors = sorted.filter((e) => e.exerciseType === type);
  if (anchors.length < 2) return { hours: EXERCISE_FALLBACK_HOURS, observed: false };
  const byBucket = {};
  anchors.forEach((anchor) => {
    const t0 = new Date(anchor.timestamp).getTime();
    sorted.forEach((e) => {
      if (!e.bg) return;
      const dt = (new Date(e.timestamp).getTime() - t0) / 3600000;
      if (dt < 0 || dt > 6) return;
      const b = Math.floor(dt * 2) / 2;
      (byBucket[b] = byBucket[b] || []).push(Number(e.bg));
    });
  });
  const buckets = Object.keys(byBucket).map(Number).sort((a, b) => a - b);
  if (buckets.length < 3) return { hours: EXERCISE_FALLBACK_HOURS, observed: false };
  const baseline = byBucket[buckets[0]].reduce((a, v) => a + v, 0) / byBucket[buckets[0]].length;
  let lastMoved = buckets[0];
  buckets.forEach((b) => {
    const avg = byBucket[b].reduce((a, v) => a + v, 0) / byBucket[b].length;
    if (Math.abs(avg - baseline) > 0.5) lastMoved = b; // >0.5 mmol/L from baseline counts as "still moving"
  });
  return { hours: Math.max(lastMoved + 0.5, 1), observed: true };
}

function computeNowPanel(sorted) {
  const now = Date.now();
  const raising = [];
  const lowering = [];

  // IOB — 4hr linear decay from whenever it was logged
  const iobEntries = sorted.filter((e) => e.iob && Number(e.iob) > 0);
  if (iobEntries.length) {
    const last = iobEntries[iobEntries.length - 1];
    const elapsedMin = (now - new Date(last.timestamp).getTime()) / 60000;
    if (elapsedMin < IOB_DURATION_MIN) {
      const remaining = Number(last.iob) * (1 - elapsedMin / IOB_DURATION_MIN);
      if (remaining > 0.05) {
        lowering.push({
          label: `IOB ~${remaining.toFixed(1)}u remaining`,
          detail: `${Number(last.iob)}u logged ${Math.round(elapsedMin)}m ago · 4hr decay`,
        });
      }
    }
  }

  // Food — window depends on macro combo
  const foodEntries = sorted.filter((e) => foodTagLabel(e));
  foodEntries.slice().reverse().forEach((e) => {
    const tag = foodTagLabel(e);
    const windowHrs = FOOD_WINDOWS[tag] || 3;
    const elapsedHrs = (now - new Date(e.timestamp).getTime()) / 3600000;
    if (elapsedHrs >= 0 && elapsedHrs < windowHrs) {
      raising.push({
        label: `${tag} — ${Math.round(elapsedHrs * 60)}m ago`,
        detail: `Typically active ~${windowHrs}hr (fat/protein slow absorption — general physiology, not personalized)`,
      });
    }
  });

  // Stress — informational, short window
  const stressEntries = sorted.filter((e) => e.stress && Number(e.stress) >= 3);
  if (stressEntries.length) {
    const last = stressEntries[stressEntries.length - 1];
    const elapsedHrs = (now - new Date(last.timestamp).getTime()) / 3600000;
    if (elapsedHrs < STRESS_WINDOW_HOURS) {
      raising.push({
        label: `Stress ${last.stress}/5 — ${Math.round(elapsedHrs * 60)}m ago`,
        detail: "Stress hormones can raise BG independent of food",
      });
    }
  }

  // Exercise — window learned from the user's own logged history per type
  const exerciseEntries = sorted.filter((e) => e.exerciseType);
  exerciseEntries.slice().reverse().forEach((e) => {
    const { hours, observed } = observedExerciseWindow(sorted, e.exerciseType);
    const elapsedHrs = (now - new Date(e.timestamp).getTime()) / 3600000;
    if (elapsedHrs >= 0 && elapsedHrs < hours) {
      lowering.push({
        label: `${e.exerciseType} — ${Math.round(elapsedHrs * 60)}m ago`,
        detail: observed
          ? `Your history: BG effects from ${e.exerciseType} typically settle by ~${hours}hr`
          : `Not enough ${e.exerciseType} history yet — using default ${hours}hr window`,
      });
    }
  });

  return { raising, lowering };
}

const COLORS = ["#5b8def", "#e0664c", "#4caf7d", "#c9a227", "#9b6bd6"];

// Minimal dependency-free SVG line chart.
function LineChart({ data, xKey, seriesKeys, height = 260 }) {
  const width = 100; // percent-based viewBox, scales with container
  const padL = 8, padR = 2, padT = 6, padB = 10;
  const allVals = [];
  data.forEach((row) => seriesKeys.forEach((k) => { if (row[k] != null) allVals.push(row[k]); }));
  if (allVals.length === 0) {
    return <div style={{ color: "#7a8296", fontSize: 13, padding: "24px 0", textAlign: "center" }}>Not enough data yet.</div>;
  }
  const min = Math.min(...allVals), max = Math.max(...allVals);
  const yMin = Math.floor((min - 1) * 2) / 2, yMax = Math.ceil((max + 1) * 2) / 2;
  const n = data.length;
  const x = (i) => padL + (i / Math.max(1, n - 1)) * (width - padL - padR);
  const y = (v) => padT + (1 - (v - yMin) / (yMax - yMin || 1)) * (100 - padT - padB);

  return (
    <div>
      <svg viewBox={`0 0 ${width} 100`} style={{ width: "100%", height }} preserveAspectRatio="none">
        {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
          <line key={i} x1={padL} x2={width - padR} y1={padT + f * (100 - padT - padB)} y2={padT + f * (100 - padT - padB)}
            stroke="#2a2f3a" strokeWidth="0.3" />
        ))}
        {seriesKeys.map((k, si) => {
          const pts = data.map((row, i) => (row[k] != null ? [x(i), y(row[k])] : null)).filter(Boolean);
          if (pts.length === 0) return null;
          const path = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p[0]},${p[1]}`).join(" ");
          return (
            <g key={k}>
              <path d={path} fill="none" stroke={COLORS[si % COLORS.length]} strokeWidth="0.7" vectorEffect="non-scaling-stroke" />
              {pts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="0.9" fill={COLORS[si % COLORS.length]} />)}
            </g>
          );
        })}
      </svg>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 12, fontSize: 11, color: "#a8afc0", marginTop: 4 }}>
        {seriesKeys.map((k, i) => (
          <span key={k} style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 8, height: 8, borderRadius: 4, background: COLORS[i % COLORS.length], display: "inline-block" }} />
            {k}
          </span>
        ))}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, color: "#7a8296", marginTop: 2 }}>
        <span>{data[0] ? data[0][xKey] : ""}</span>
        <span>{data[data.length - 1] ? data[data.length - 1][xKey] : ""}</span>
      </div>
    </div>
  );
}

function Field({ label, required, children }) {
  return (
    <div style={styles.field}>
      <label style={styles.label}>{label}{required && <span style={styles.req}> *</span>}</label>
      {children}
    </div>
  );
}

function App() {
  const [entries, setEntries] = useState(() => loadEntries());
  const [tab, setTab] = useState("now");
  const [form, setForm] = useState(emptyEntry());
  const [error, setError] = useState("");
  const [insightAnchor, setInsightAnchor] = useState("exercise");

  function persist(next) {
    setEntries(next);
    if (!saveEntries(next)) setError("Save failed — storage may be full.");
  }

  function updateField(key, val) { setForm((f) => ({ ...f, [key]: val })); }

  function submitEntry() {
    if (!form.bg) { setError("BG reading required."); return; }
    setError("");
    const entry = { ...form, id: Date.now(), timestamp: estInputToISO(form.timestamp) };
    const next = [...entries, entry].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    persist(next);
    setForm(emptyEntry());
    setTab("history");
  }

  function deleteEntry(id) { persist(entries.filter((e) => e.id !== id)); }

  const sorted = useMemo(() => [...entries].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)), [entries]);

  const [tick, setTick] = useState(0);
  useEffect(() => {
    if (tab !== "now") return;
    const id = setInterval(() => setTick((t) => t + 1), 60000);
    return () => clearInterval(id);
  }, [tab]);

  const nowPanel = useMemo(() => computeNowPanel(sorted), [sorted, tab, tick]);

  const exerciseInsights = useMemo(() => {
    const anchors = sorted.filter((e) => e.exerciseType);
    const byType = {};
    anchors.forEach((anchor) => {
      const t0 = new Date(anchor.timestamp).getTime();
      sorted.forEach((e) => {
        if (!e.bg) return;
        const dt = (new Date(e.timestamp).getTime() - t0) / 3600000;
        if (dt < 0 || dt > 6) return;
        const type = anchor.exerciseType;
        if (!byType[type]) byType[type] = {};
        const b = bucketLabel(dt);
        (byType[type][b] = byType[type][b] || []).push(Number(e.bg));
      });
    });
    const buckets = Array.from({ length: 12 }, (_, i) => `${i * 0.5}-${i * 0.5 + 0.5}h`);
    const chartData = buckets.map((b) => {
      const row = { bucket: b };
      Object.keys(byType).forEach((type) => {
        const vals = byType[type][b];
        if (vals && vals.length) row[type] = Math.round((vals.reduce((a, v) => a + v, 0) / vals.length) * 10) / 10;
      });
      return row;
    });
    return { chartData, types: Object.keys(byType) };
  }, [sorted]);

  const foodInsights = useMemo(() => {
    const anchors = sorted.filter((e) => foodTagLabel(e));
    const byTag = {};
    anchors.forEach((anchor) => {
      const tag = foodTagLabel(anchor);
      const t0 = new Date(anchor.timestamp).getTime();
      sorted.forEach((e) => {
        if (!e.bg) return;
        const dt = (new Date(e.timestamp).getTime() - t0) / 3600000;
        if (dt < 0 || dt > 4) return;
        if (!byTag[tag]) byTag[tag] = {};
        const b = bucketLabel(dt);
        (byTag[tag][b] = byTag[tag][b] || []).push(Number(e.bg));
      });
    });
    const buckets = Array.from({ length: 8 }, (_, i) => `${i * 0.5}-${i * 0.5 + 0.5}h`);
    const chartData = buckets.map((b) => {
      const row = { bucket: b };
      Object.keys(byTag).forEach((tag) => {
        const vals = byTag[tag][b];
        if (vals && vals.length) row[tag] = Math.round((vals.reduce((a, v) => a + v, 0) / vals.length) * 10) / 10;
      });
      return row;
    });
    return { chartData, tags: Object.keys(byTag) };
  }, [sorted]);

  return (
    <div style={styles.app}>
      <div style={styles.header}>
        <div style={styles.headerTitle}>BG TRACKER</div>
        <div style={styles.headerSub}>Type 1 · pattern log · mmol/L · EST</div>
      </div>

      <div style={styles.tabs}>
        {["now", "log", "history", "insights"].map((t) => (
          <button key={t} onClick={() => setTab(t)} style={{ ...styles.tabBtn, ...(tab === t ? styles.tabBtnActive : {}) }}>
            {t.toUpperCase()}
          </button>
        ))}
      </div>

      {error && <div style={styles.error}>{error}</div>}

      {tab === "now" && (
        <div style={styles.nowPanel}>
          <div style={styles.insightNote}>What's currently active, based on your logs. No recommendation — you decide.</div>
          <div style={styles.nowCols}>
            <div style={styles.nowCol}>
              <div style={{ ...styles.nowColHeader, color: "#e0664c" }}>RAISING</div>
              {nowPanel.raising.length === 0 && <div style={styles.nowEmpty}>Nothing active</div>}
              {nowPanel.raising.map((f, i) => (
                <div key={i} style={styles.nowItem}>
                  <div style={styles.nowItemLabel}>{f.label}</div>
                  <div style={styles.nowItemDetail}>{f.detail}</div>
                </div>
              ))}
            </div>
            <div style={styles.nowCol}>
              <div style={{ ...styles.nowColHeader, color: "#5b8def" }}>LOWERING</div>
              {nowPanel.lowering.length === 0 && <div style={styles.nowEmpty}>Nothing active</div>}
              {nowPanel.lowering.map((f, i) => (
                <div key={i} style={styles.nowItem}>
                  <div style={styles.nowItemLabel}>{f.label}</div>
                  <div style={styles.nowItemDetail}>{f.detail}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {tab === "log" && (
        <div style={styles.form}>
          <Field label="Time (EST)">
            <input type="datetime-local" value={form.timestamp} onChange={(e) => updateField("timestamp", e.target.value)} style={styles.input} />
          </Field>
          <Field label="BG (mmol/L)" required>
            <input type="number" step="0.1" value={form.bg} onChange={(e) => updateField("bg", e.target.value)} style={styles.input} placeholder="6.7" />
          </Field>
          <div style={styles.row2}>
            <Field label="IOB (u)">
              <input type="number" step="0.1" value={form.iob} onChange={(e) => updateField("iob", e.target.value)} style={styles.input} />
            </Field>
            <Field label="Basal (u/hr)">
              <input type="number" step="0.05" value={form.basal} onChange={(e) => updateField("basal", e.target.value)} style={styles.input} />
            </Field>
          </div>
          <Field label="Food">
            <div style={styles.tagRow}>
              {["Carb", "Protein", "Fat"].map((tag) => {
                const key = "food" + tag;
                return (
                  <button key={tag} onClick={() => updateField(key, !form[key])} style={{ ...styles.tag, ...(form[key] ? styles.tagActive : {}) }}>
                    {tag}
                  </button>
                );
              })}
              <button onClick={() => updateField("showFoodDetail", !form.showFoodDetail)} style={styles.detailToggle}>
                {form.showFoodDetail ? "− hide grams" : "+ add detail"}
              </button>
            </div>
            {form.showFoodDetail && (
              <div style={styles.row3}>
                <input type="number" placeholder="carb g" value={form.carbG} onChange={(e) => updateField("carbG", e.target.value)} style={styles.input} />
                <input type="number" placeholder="protein g" value={form.proteinG} onChange={(e) => updateField("proteinG", e.target.value)} style={styles.input} />
                <input type="number" placeholder="fat g" value={form.fatG} onChange={(e) => updateField("fatG", e.target.value)} style={styles.input} />
              </div>
            )}
          </Field>
          <Field label="Exercise">
            <div style={styles.tagRow}>
              {EXERCISE_TYPES.map((t) => (
                <button key={t} onClick={() => updateField("exerciseType", form.exerciseType === t ? "" : t)} style={{ ...styles.tag, ...(form.exerciseType === t ? styles.tagActive : {}) }}>
                  {t}
                </button>
              ))}
            </div>
            {form.exerciseType && (
              <div style={styles.row2}>
                <input type="number" placeholder="duration (min)" value={form.exerciseDuration} onChange={(e) => updateField("exerciseDuration", e.target.value)} style={styles.input} />
                <button onClick={() => updateField("training", !form.training)} style={{ ...styles.tag, ...(form.training ? styles.tagActive : {}) }}>
                  Training day
                </button>
              </div>
            )}
          </Field>
          <div style={styles.row2}>
            <Field label="Stress (1-5)">
              <input type="number" min="1" max="5" value={form.stress} onChange={(e) => updateField("stress", e.target.value)} style={styles.input} />
            </Field>
            <Field label="ISF (mmol/L per u)">
              <input type="number" step="0.1" value={form.isf} onChange={(e) => updateField("isf", e.target.value)} style={styles.input} />
            </Field>
          </div>
          <Field label="Notes">
            <textarea value={form.notes} onChange={(e) => updateField("notes", e.target.value)} style={styles.textarea} rows={2} />
          </Field>
          <button onClick={submitEntry} style={styles.submitBtn}>Save entry</button>
        </div>
      )}

      {tab === "history" && (
        <div style={styles.history}>
          {sorted.length === 0 && <div style={styles.empty}>No entries yet. Log one to start.</div>}
          {[...sorted].reverse().map((e) => (
            <div key={e.id} style={styles.entryCard}>
              <div style={styles.entryTop}>
                <span style={styles.entryBg}>{e.bg} <span style={styles.entryUnit}>mmol/L</span></span>
                <span style={styles.entryTime}>{formatEST(e.timestamp)}</span>
                <button onClick={() => deleteEntry(e.id)} style={styles.deleteBtn}>×</button>
              </div>
              <div style={styles.entryTags}>
                {e.iob && <span style={styles.pill}>IOB {e.iob}u</span>}
                {e.basal && <span style={styles.pill}>Basal {e.basal}</span>}
                {foodTagLabel(e) && <span style={styles.pill}>{foodTagLabel(e)}</span>}
                {e.exerciseType && <span style={styles.pill}>{e.exerciseType} {e.exerciseDuration ? e.exerciseDuration + "m" : ""}</span>}
                {e.training && <span style={styles.pill}>Training</span>}
                {e.stress && <span style={styles.pill}>Stress {e.stress}/5</span>}
              </div>
              {e.notes && <div style={styles.entryNotes}>{e.notes}</div>}
            </div>
          ))}
        </div>
      )}

      {tab === "insights" && (
        <div style={styles.insights}>
          <div style={styles.tabs}>
            <button onClick={() => setInsightAnchor("exercise")} style={{ ...styles.tabBtn, ...(insightAnchor === "exercise" ? styles.tabBtnActive : {}) }}>EXERCISE</button>
            <button onClick={() => setInsightAnchor("food")} style={{ ...styles.tabBtn, ...(insightAnchor === "food" ? styles.tabBtnActive : {}) }}>FOOD</button>
          </div>
          {insightAnchor === "exercise" && (
            <>
              <div style={styles.insightNote}>Average BG by time-since-start, grouped by exercise type. Descriptive only — reflects your logged history, not a prediction.</div>
              {exerciseInsights.types.length === 0
                ? <div style={styles.empty}>Log exercise + follow-up BG readings to see patterns.</div>
                : <LineChart data={exerciseInsights.chartData} xKey="bucket" seriesKeys={exerciseInsights.types} />}
            </>
          )}
          {insightAnchor === "food" && (
            <>
              <div style={styles.insightNote}>Average BG by time-since-meal, grouped by macro tag combo. Descriptive only.</div>
              {foodInsights.tags.length === 0
                ? <div style={styles.empty}>Log food tags + follow-up BG readings to see patterns.</div>
                : <LineChart data={foodInsights.chartData} xKey="bucket" seriesKeys={foodInsights.tags} />}
            </>
          )}
        </div>
      )}
    </div>
  );
}

const styles = {
  app: { fontFamily: "'JetBrains Mono', 'SF Mono', Menlo, monospace", background: "#14161c", color: "#e6e8ee", minHeight: "100vh", padding: "16px", maxWidth: 480, margin: "0 auto" },
  header: { marginBottom: 16, borderBottom: "1px solid #2a2f3a", paddingBottom: 12 },
  headerTitle: { fontSize: 20, fontWeight: 700, letterSpacing: 1 },
  headerSub: { fontSize: 12, color: "#7a8296", marginTop: 2 },
  tabs: { display: "flex", gap: 6, marginBottom: 16 },
